<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | MyChat</title>
</head>

<body>

    <h1>💬 MyChat</h1>
    <h2>ورود به حساب</h2>

    <form method="POST">

        <label>آیدی:</label>
        <br>
        <input
            type="text"
            name="username"
            placeholder="آیدی شما"
            required
        >

        <br><br>

        <label>رمز عبور:</label>
        <br>
        <input
            type="password"
            name="password"
            placeholder="رمز عبور"
            required
        >

        <br><br>

        <button type="submit">ورود</button>

    </form>

    <p>
        حساب نداری؟
        <a href="/register">ثبت‌نام</a>
    </p>

</body>
</html>
